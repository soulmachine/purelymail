[workspace]
members = ["tools/gen"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/soulmachine/purelymail"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

[package]
name = "purelymail"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command line interface to the Purelymail API, generated from its OpenAPI spec"
readme = "README.md"
keywords = ["purelymail", "email", "cli", "api"]
categories = ["command-line-utilities"]
exclude = ["tools/", ".github/"]

[dependencies]
clap = { version = "4", features = ["string"] }
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
toml = "1"
ureq.workspace = true

[dev-dependencies]
mockito = "1"
